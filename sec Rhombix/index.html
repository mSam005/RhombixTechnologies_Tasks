<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Late Dial Music Player</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>


<div class="player">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="sidebar-brand">
            <i data-lucide="radio"></i>
            <span>Late Dial</span>
        </div>

        <p class="sidebar-label">Presets</p>

        <div id="genreList" class="sidebar-list">
            <!-- Genres generated by JS -->
        </div>

        <p class="sidebar-label sidebar-space">Library</p>

        <div class="sidebar-count">
            <i data-lucide="list-music"></i>
            <span id="trackCount"></span>
        </div>

    </aside>

    <!-- Main -->
    <main class="main">

        <div class="search-bar">

            <i data-lucide="search"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search tracks, artists, moods..."
            >

        </div>

        <div id="trackList" class="track-list"></div>

    </main>

</div>

<!-- Bottom Player -->

<footer class="player-bar">

    <div class="now-playing">

        <div id="disc" class="disc"></div>

        <div>

            <div id="songTitle" class="song-title"></div>

            <div id="songArtist" class="song-artist"></div>

        </div>

    </div>

    <div class="transport">

        <div class="buttons">

            <button id="prevBtn">
                <i data-lucide="skip-back"></i>
            </button>

            <button id="playBtn" class="play-btn">
                <i data-lucide="play"></i>
            </button>

            <button id="nextBtn">
                <i data-lucide="skip-forward"></i>
            </button>

        </div>

        <div class="progress-row">

            <span id="currentTime">0:00</span>

            <input
                type="range"
                id="progress"
                value="0"
                min="0"
                max="100"
            >

            <span id="duration">0:00</span>

        </div>

    </div>

    <div class="volume">

        <button id="muteBtn">
            <i data-lucide="volume-2"></i>
        </button>

        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
        >

    </div>

</footer>

<audio id="audio"></audio>

<script src="script.js"></script>

<script>
lucide.createIcons();
</script>

</body>
</html>
